version: 1

settings:
  # 输出最近多少个实际交易日。脚本会自动跳过周末、节假日和停牌空白。
  history_trade_days: 60

  # 为覆盖 60 个交易日，向前查询 120 个自然日。
  lookback_calendar_days: 120

  # Tushare daily 支持逗号分隔的多只股票；分组可避免扩展股票池后单次记录过多。
  request_chunk_size: 50

  retry_attempts: 3
  retry_base_seconds: 2

# 扩展方法：复制任意 A 股条目并修改 ts_code、name、note。
# ts_code 格式：上交所 600000.SH、深交所 000001.SZ、北交所 920xxx.BJ。
# 同一股票可以出现在多个大池中，脚本会合并行情并保留全部池标签。
# 港股不放入 stocks；统一放入 external_stocks，避免被当前 A 股 Tushare daily 接口请求。
# 校验结果：五个池共 161 条记录，全局去重后 154 个标的（A股 151、港股 3）。
